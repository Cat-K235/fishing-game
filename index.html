<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Pixel Fishing</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="hud-top"></div>

      <div id="game-view">
        <canvas id="game-canvas"></canvas>
        <div id="zone-hint" class="zone-hint hidden"></div>
        <div id="fishing-hud"></div>
        <div id="joystick-base" class="joystick-base">
          <div id="joystick-stick" class="joystick-stick"></div>
        </div>
      </div>

      <div id="bottom-nav"></div>
      <div id="inventory-panel" class="overlay-panel hidden"></div>
      <div id="shop-panel" class="overlay-panel hidden"></div>
      <div id="toast-root"></div>
      <div id="catch-overlay-root" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
